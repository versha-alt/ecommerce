services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: olive_admin
      MYSQL_USER: olive
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-olive_local_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_only}
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
volumes:
  mysql_data:
  redis_data:
